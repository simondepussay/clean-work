name: Veille du site

# Toutes les 2 heures, le test de fumée vérifie le site en ligne (pages, santé de l'API,
# routes protégées). S'il échoue, GitHub envoie un email : on apprend la panne avant les
# utilisateurs. Toutes les 2 heures plutôt que toutes les heures : le dépôt est privé,
# et GitHub Actions n'y offre que 2 000 minutes par mois.
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node tools/smoke.mjs https://cleanwork.simondepussay.com "" https://func-shukatsu-ijdqobb4nlsxu.azurewebsites.net
