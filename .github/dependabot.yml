# Mises à jour des dépendances : une PR groupée par semaine et par dossier (moins de bruit qu'une PR par paquet).
# Les failles de sécurité arrivent tout de suite, sans attendre le lundi (alertes Dependabot du dépôt).
version: 2
updates:
  - package-ecosystem: npm
    directory: /api
    schedule: { interval: weekly, day: monday, timezone: Asia/Tokyo }
    groups: { api: { patterns: ["*"], update-types: [minor, patch] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly, day: monday, timezone: Asia/Tokyo }
    groups: { web: { patterns: ["*"], update-types: [minor, patch] } }
  # Les actions sont fixées par SHA : Dependabot met à jour le SHA et le commentaire de version.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
