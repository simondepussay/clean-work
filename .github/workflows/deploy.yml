name: Tests et déploiement

# main         → tests, déploiement en production, vérification que la bonne version est en ligne
# pull request → tests seulement. Pas d'environnement de prévisualisation : sur Static Web Apps,
#                il partagerait les réglages de production (base Cosmos, secrets) derrière une URL publique.
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "journal/**", "planning/**", "tools/**", "README.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", "journal/**", "planning/**", "tools/**", "README.md"]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'prod' }}
  cancel-in-progress: false

env:
  SITE: https://cleanwork.simondepussay.com

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: API — installation
        run: npm ci
        working-directory: api
      - name: API — failles connues des dépendances
        run: npm audit --omit=dev --audit-level=high
        working-directory: api
      - name: API — types et tests
        run: npm run typecheck && npm test
        working-directory: api
      - name: Web — installation
        run: npm ci
        working-directory: web
      - name: Web — failles connues des dépendances
        run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - name: Web — lint, tests et build
        run: npm run lint && npm test && npm run build
        working-directory: web

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # id-token : connexion OIDC à Azure (sans secret) pour déployer l'API de Séoul.
    permissions:
      contents: read
      id-token: write
    env:
      KOREA_API: https://func-shukatsu-ijdqobb4nlsxu.azurewebsites.net
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Version déployée
        run: echo "{\"version\":\"${GITHUB_SHA::7}\"}" > api/version.json

      # L'API est à Séoul (infra/api-korea.bicep), à côté de la base et de l'IA : déployée d'abord, pour
      # que le site ne parle jamais à une API plus ancienne que lui. Static Web Apps ne sert plus que les pages.
      - name: API de Séoul — identité de déploiement présente ?
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          [ -n "$CLIENT_ID" ] && exit 0
          echo "::error::Identité de déploiement absente : lancer « sh infra/github-deploy-identity.sh » (une fois)."
          exit 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - name: API de Séoul — paquet
        run: |
          cd api && npm ci && npm run build
          mkdir -p ../api-korea
          cp -R dist host.json package.json package-lock.json content assets version.json ../api-korea/
          cd ../api-korea && npm ci --omit=dev
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
        with:
          app-name: func-shukatsu-ijdqobb4nlsxu
          package: api-korea
          sku: flexconsumption
      - name: API de Séoul — attendre la nouvelle version
        run: |
          for i in $(seq 1 20); do
            BODY=$(curl -fsS "$KOREA_API/api/health" || true)
            echo "$BODY" | grep -q "\"version\":\"${GITHUB_SHA::7}\"" && exit 0
            sleep 10
          done
          echo "L'API de Séoul n'a pas la version ${GITHUB_SHA::7}"; exit 1

      - uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        # Les pages seulement ; elles appellent l'API de Séoul.
        env:
          VITE_API_BASE: ${{ env.KOREA_API }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          output_location: dist
      - name: Test de fumée sur le site en ligne
        run: node tools/smoke.mjs "$SITE" "${GITHUB_SHA::7}" "$KOREA_API"

