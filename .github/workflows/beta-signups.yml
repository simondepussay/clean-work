name: Demandes de bêta TestFlight

# Chaque matin à 9 h (heure du Japon), les nouvelles demandes du formulaire « βテスト » arrivent par e-mail :
# le workflow crée un « issue » GitHub qui mentionne le propriétaire (dépôt privé : les adresses restent privées).
# Il ne se passe rien s'il n'y a pas de nouvelle demande.
on:
  schedule:
    - cron: "0 0 * * *" # 0 h UTC = 9 h JST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  signups:
    runs-on: ubuntu-latest
    steps:
      - name: Nouvelles demandes
        env:
          SECRET: ${{ secrets.PUSH_CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 60 -X POST -H "x-shukatsu-cron: $SECRET" \
            https://cleanwork.simondepussay.com/api/beta/run > signups.json
          echo "Nouvelles demandes : $(jq '.signups | length' signups.json)"
      - name: Envoyer la liste (issue GitHub + e-mail)
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          count=$(jq '.signups | length' signups.json)
          [ "$count" -eq 0 ] && exit 0
          {
            echo "@$OWNER, $count nouvelle(s) demande(s) pour la bêta TestFlight."
            echo
            echo "| E-mail (compte Apple) | Appareil | Langue | Message |"
            echo "|---|---|---|---|"
            jq -r '.signups[] | "| \(.email) | \(.device) | \(.lang) | \((.message // "") | gsub("\\|"; "/") | gsub("\n"; " ")) |"' signups.json
            echo
            echo "À faire : [App Store Connect](https://appstoreconnect.apple.com) → Clean Work → TestFlight → groupe de testeurs externes → **Ajouter des testeurs** (coller les adresses)."
            echo "Apple envoie alors l'invitation à chacun. Les adresses sont effacées de la base 180 jours après la demande."
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Bêta TestFlight — $count demande(s) — $(date -u +%Y-%m-%d)" --body-file body.md
