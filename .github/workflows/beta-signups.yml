name: Demandes de bêta TestFlight

# Chaque matin à 9 h (heure du Japon), les nouvelles demandes du formulaire « βテスト » sont signalées par e-mail :
# le workflow crée un « issue » GitHub qui mentionne le propriétaire, avec le NOMBRE de demandes seulement.
# Les adresses sont dans un fichier joint à l'exécution (« artifact »), effacé par GitHub au bout de 7 jours :
# elles ne restent pas dans les issues, alors que la politique de confidentialité promet de les effacer.
# Il ne se passe rien s'il n'y a pas de nouvelle demande.
on:
  schedule:
    - cron: "0 0 * * *" # 0 h UTC = 9 h JST
  workflow_dispatch:

permissions:
  issues: write

jobs:
  signups:
    runs-on: ubuntu-latest
    steps:
      - name: Nouvelles demandes
        id: fetch
        env:
          # Un secret par tâche (infra/cron-secrets.mjs) ; l'ancien secret commun tant qu'il n'est pas posé.
          SECRET: ${{ secrets.CRON_SECRET_BETA || secrets.PUSH_CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-all-errors --max-time 60 -X POST -H "x-shukatsu-cron: $SECRET" \
            https://func-shukatsu-ijdqobb4nlsxu.azurewebsites.net/api/beta/run > signups.json
          count=$(jq '.signups | length' signups.json)
          echo "Nouvelles demandes : $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          # Le fichier joint : un tableau à ouvrir, et la liste des adresses prête à coller dans App Store Connect.
          jq -r '.signups[] | [.email, .device, .lang, (.message // "" | gsub("\n"; " ")), .createdAt] | @csv' signups.json > demandes.csv
          jq -r '.signups[].email' signups.json > adresses.txt
      - name: Joindre les adresses (effacées dans 7 jours)
        if: steps.fetch.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demandes-beta
          path: |
            demandes.csv
            adresses.txt
          retention-days: 7
      - name: Prévenir (issue GitHub + e-mail, sans adresse)
        if: steps.fetch.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          COUNT: ${{ steps.fetch.outputs.count }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "@$OWNER, $COUNT nouvelle(s) demande(s) pour la bêta TestFlight."
            echo
            echo "Les adresses sont dans le fichier **demandes-beta** de [cette exécution]($RUN) (effacé par GitHub dans 7 jours)."
            echo
            echo "À faire : [App Store Connect](https://appstoreconnect.apple.com) → Clean Work → TestFlight → groupe de testeurs externes → **Ajouter des testeurs** (coller le contenu de adresses.txt)."
            echo "Apple envoie alors l'invitation à chacun. Les demandes sont effacées de la base 180 jours après leur arrivée."
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "Bêta TestFlight — $COUNT demande(s) — $(date -u +%Y-%m-%d)" --body-file body.md
