name: Tests et déploiement

# main         → tests, déploiement en production, vérification que la bonne version est en ligne
# pull request → tests + environnement de prévisualisation (URL temporaire), supprimé à la fermeture
on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "journal/**", "planning/**", "tools/**", "README.md"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
    paths-ignore: ["docs/**", "journal/**", "planning/**", "tools/**", "README.md"]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.event.pull_request.number || 'prod' }}
  cancel-in-progress: false

env:
  SITE: https://cleanwork.simondepussay.com

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: API — installation
        run: npm ci
        working-directory: api
      - name: API — types et tests
        run: npm run typecheck && npm test
        working-directory: api
      - name: Web — installation
        run: npm ci
        working-directory: web
      - name: Web — lint, tests et build
        run: npm run lint && npm test && npm run build
        working-directory: web

  deploy:
    needs: test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Version déployée
        run: echo "{\"version\":\"${GITHUB_SHA::7}\"}" > api/version.json
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: dist
      - name: Attendre la nouvelle version
        if: github.event_name == 'push'
        run: |
          for i in $(seq 1 20); do
            BODY=$(curl -fsS "$SITE/api/health" || true)
            echo "essai $i : $BODY"
            echo "$BODY" | grep -q "\"version\":\"${GITHUB_SHA::7}\"" && exit 0
            sleep 15
          done
          echo "La version ${GITHUB_SHA::7} n'est pas en ligne"; exit 1
      - name: Test de fumée sur le site en ligne
        if: github.event_name == 'push'
        run: node tools/smoke.mjs "$SITE" "${GITHUB_SHA::7}"

  close-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
